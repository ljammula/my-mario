<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>My Mario</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 190px);
      width: auto;
      height: auto;
    }

    /* ── Touch controls overlay ── */
    #touch-controls {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(190px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 100%);
      z-index: 100;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      pointer-events: none;
    }
    @media (pointer: coarse) {
      #touch-controls { display: block; }
    }
    @media (pointer: coarse) and (orientation: landscape) {
      canvas { max-height: 100vh; }
      #touch-controls { background: rgba(0,0,0,0.15); }
    }

    /* ── Base button ── */
    .touch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid rgba(255,255,255,0.42);
      background: rgba(38,38,38,0.72);
      color: #fff;
      font-weight: bold;
      font-family: inherit;
      touch-action: none;
      cursor: pointer;
      pointer-events: all;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.05s, transform 0.05s;
      border-radius: 10px;
    }
    .touch-btn:active,
    .touch-btn.pressed {
      background: rgba(180,180,180,0.88);
      border-color: rgba(255,255,255,0.95);
      transform: scale(0.91);
    }

    /* ── Left zone: ◄ ► stacked ── */
    #dpad {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #btn-left,
    #btn-right {
      width: 108px;
      height: 56px;
      font-size: 26px;
      letter-spacing: 2px;
    }

    /* ── Center utility: SELECT / START ── */
    #utility-buttons {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      gap: 10px;
    }
    #btn-select,
    #btn-start {
      width: 64px;
      height: 22px;
      font-size: 9px;
      letter-spacing: 1px;
      border-radius: 11px;
      background: rgba(25,25,60,0.72);
      border-color: rgba(140,140,240,0.55);
    }

    /* ── Right zone: B (upper-left) + A (lower-right) diagonal ── */
    #action-buttons {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
      right: 16px;
      width: 188px;
      height: 120px;
    }
    #btn-a {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 88px;
      height: 88px;
      font-size: 30px;
      background: rgba(18,110,18,0.78);
      border-color: rgba(90,210,90,0.72);
      border-radius: 12px;
    }
    #btn-a.pressed { background: rgba(38,170,38,0.92); }
    #btn-b {
      position: absolute;
      bottom: 30px;
      right: 96px;
      width: 70px;
      height: 70px;
      font-size: 24px;
      background: rgba(150,18,18,0.78);
      border-color: rgba(220,90,90,0.72);
      border-radius: 12px;
    }
    #btn-b.pressed { background: rgba(215,38,38,0.92); }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="512" height="480"></canvas>
  <div id="touch-controls">
    <div id="dpad">
      <button class="touch-btn" id="btn-left"  aria-label="Left">◄</button>
      <button class="touch-btn" id="btn-right" aria-label="Right">►</button>
    </div>
    <div id="utility-buttons">
      <button class="touch-btn" id="btn-select" aria-label="Select">SELECT</button>
      <button class="touch-btn" id="btn-start"  aria-label="Start/Pause">START</button>
    </div>
    <div id="action-buttons">
      <button class="touch-btn" id="btn-b" aria-label="Run/Fire">B</button>
      <button class="touch-btn" id="btn-a" aria-label="Jump">A</button>
    </div>
  </div>
  <!-- Load order matters: each file depends only on files above it -->
  <script src="js/constants.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/level.js"></script>
  <script src="js/state.js"></script>
  <script src="js/input.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/mario.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/items.js"></script>
  <script src="js/fireballs.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
