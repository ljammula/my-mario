<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>My Mario</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 140px);
      width: auto;
      height: auto;
    }
    #touch-controls {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      padding: 6px 12px calc(env(safe-area-inset-bottom, 0px) + 6px);
      background: rgba(0, 0, 0, 0.35);
      z-index: 100;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      align-items: flex-end;
      justify-content: space-between;
    }
    @media (pointer: coarse) {
      #touch-controls {
        display: flex;
      }
    }
    @media (pointer: coarse) and (orientation: landscape) {
      canvas {
        max-height: 100vh;
      }
      #touch-controls {
        background: rgba(0, 0, 0, 0.2);
      }
    }
    .touch-btn {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 3px solid rgba(255, 255, 255, 0.5);
      background: rgba(50, 50, 50, 0.75);
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.05s, transform 0.05s;
    }
    .touch-btn:active,
    .touch-btn.pressed {
      background: rgba(150, 150, 150, 0.9);
      border-color: rgba(255, 255, 255, 0.9);
      transform: scale(0.92);
    }
    #dpad {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #btn-left,
    #btn-right {
      width: 130px;
      height: 52px;
      font-size: 30px;
      border-radius: 12px;
    }
    #center-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    #center-controls #btn-left {
      width: 130px;
      height: 52px;
      font-size: 30px;
      border-radius: 12px;
    }
    #action-buttons {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    #btn-a {
      background: rgba(20, 120, 20, 0.75);
      border-color: rgba(100, 220, 100, 0.7);
      width: 70px;
      height: 70px;
      font-size: 22px;
      border-radius: 12px;
    }
    #btn-a.pressed {
      background: rgba(40, 180, 40, 0.9);
    }
    #btn-b {
      background: rgba(160, 20, 20, 0.75);
      border-color: rgba(220, 100, 100, 0.7);
      width: 70px;
      height: 70px;
      font-size: 22px;
      border-radius: 12px;
    }
    #btn-b.pressed {
      background: rgba(220, 40, 40, 0.9);
    }
    #btn-start {
      width: 64px;
      height: 28px;
      border-radius: 14px;
      font-size: 11px;
      letter-spacing: 0.5px;
      background: rgba(30, 30, 70, 0.75);
      border-color: rgba(150, 150, 255, 0.6);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="512" height="480"></canvas>
  <div id="touch-controls">
    <div id="dpad">
      <button class="touch-btn" id="btn-right" aria-label="Right">►</button>
    </div>
    <div id="center-controls">
      <button class="touch-btn" id="btn-start" aria-label="Start/Pause">START</button>
      <button class="touch-btn" id="btn-left" aria-label="Left">◄</button>
    </div>
    <div id="action-buttons">
      <button class="touch-btn" id="btn-b" aria-label="Run/Fire">B</button>
      <button class="touch-btn" id="btn-a" aria-label="Jump">A</button>
    </div>
  </div>
  <!-- Load order matters: each file depends only on files above it -->
  <script src="js/constants.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/level.js"></script>
  <script src="js/state.js"></script>
  <script src="js/input.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/mario.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/items.js"></script>
  <script src="js/fireballs.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
